<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>BaezBeats video output</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: default; }
    .stage { position: absolute; inset: 0; opacity: var(--level, 1); }
    video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; opacity: 0; }
    video.broken { visibility: hidden; }
    .hint {
      position: absolute; left: 50%; bottom: 6%; transform: translateX(-50%);
      font: 500 18px "Avenir Next", system-ui, sans-serif; color: #8d94a3; text-align: center;
      transition: opacity .4s;
    }
    body.fullscreen .hint, body:not(.idle):not(:hover) .hint { opacity: 0; }
    .idle-logo {
      position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2.5vh;
      opacity: 0; transition: opacity .6s; pointer-events: none;
      font: 800 7vh "Avenir Next Condensed", "Arial Narrow", system-ui, sans-serif; color: #ece8df; letter-spacing: -0.01em;
    }
    .idle-logo img { width: 34vh; height: 34vh; }
    body.idle .idle-logo { opacity: 1; }
  </style>
</head>
<body class="idle">
  <div class="stage"><video muted playsinline preload="auto"></video><video muted playsinline preload="auto"></video></div>
  <div class="idle-logo"><img src="logo.svg" alt=""><span>BaezBeats</span></div>
  <div class="hint">Drag this window to the projector or second screen, then double-click for full screen.</div>
  <script>
    addEventListener('dblclick', () => {
      if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen();
    });
    document.addEventListener('fullscreenchange', () => document.body.classList.toggle('fullscreen', !!document.fullscreenElement));
  </script>
</body>
</html>
