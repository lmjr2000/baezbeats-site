<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="BaezBeats">
  <!-- BaezBeats mark: a record whose rim runs from deck A's amber to deck B's aqua,
       with a beat pulse cut through it. -->
  <defs>
    <linearGradient id="bb-ring" x1="0.1" y1="0.1" x2="0.9" y2="0.9">
      <stop offset="0" stop-color="#ffb43d"/>
      <stop offset="0.5" stop-color="#ff7a59"/>
      <stop offset="1" stop-color="#35c9d6"/>
    </linearGradient>
  </defs>
  <circle cx="60" cy="60" r="55" fill="#101216"/>
  <circle cx="60" cy="60" r="53" fill="none" stroke="url(#bb-ring)" stroke-width="6"/>
  <!-- grooves -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="1.3">
    <circle cx="60" cy="60" r="45"/>
    <circle cx="60" cy="60" r="39.5"/>
    <circle cx="60" cy="60" r="34"/>
    <circle cx="60" cy="60" r="28.5"/>
  </g>
  <!-- light catching the vinyl -->
  <path d="M24.4 39.5 A42 42 0 0 1 39.5 24.4" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M95.6 80.5 A42 42 0 0 1 80.5 95.6" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="3.2" stroke-linecap="round"/>
  <!-- label ring -->
  <circle cx="60" cy="60" r="21" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1.6"/>
  <!-- beat pulse: a dark cut under a white line so it reads on the label and the vinyl -->
  <path d="M6 60 H31 L37 47 L43 75 L49 30 L55 90 L61 40 L67 80 L73 51 L78 66 L82 60 H114" fill="none" stroke="#101216" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M6 60 H31 L37 47 L43 75 L49 30 L55 90 L61 40 L67 80 L73 51 L78 66 L82 60 H114" fill="none" stroke="#ffffff" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
